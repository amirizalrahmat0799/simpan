server:
  port: ${SIMPAN_PORT:9000}
  max-http-request-header-size: 16KB
  jetty:
    connection-idle-timeout: 60s

spring:
  application:
    name: simpan
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off
  mvc:
    # S3 PUT bodies are object bytes even when a client labels them form-encoded; never parse them
    formcontent:
      filter:
        enabled: false

simpan:
  data-dir: ${SIMPAN_DATA_DIR:./data}
  region: ${SIMPAN_REGION:us-east-1}
  access-key: ${SIMPAN_ACCESS_KEY:}
  secret-key: ${SIMPAN_SECRET_KEY:}

management:
  server:
    port: ${SIMPAN_MANAGEMENT_PORT:9001}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        simpan.requests: true

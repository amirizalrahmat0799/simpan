# Publishes a release when a version tag is pushed:
#   1. move the "Unreleased" notes in CHANGELOG.md under "## [0.1.0] - <date>"
#   2. git tag v0.1.0 && git push origin v0.1.0
# The release gets the runnable jar and its checksum, and the Docker image is pushed to
# ghcr.io/amirizalrahmat0799/simpan:<version> and :latest.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: |
          mvn -B -ntp versions:set -DnewVersion="${TAG#v}" -DgenerateBackupPoms=false
          mvn -B -ntp verify
          cp target/simpan.jar "simpan-${TAG#v}.jar"
          sha256sum "simpan-${TAG#v}.jar" > "simpan-${TAG#v}.jar.sha256"
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          version="${TAG#v}"
          tr -d '\r' < CHANGELOG.md | awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ { if (found) exit }
            found' > notes.md
          if [ -s notes.md ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/simpan
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: softprops/action-gh-release@v2
        with:
          name: simpan ${{ env.TAG }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ steps.notes.outputs.found == 'true' && 'notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          files: |
            simpan-*.jar
            simpan-*.jar.sha256
